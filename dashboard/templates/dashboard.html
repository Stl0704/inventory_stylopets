{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Stylopets</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  </head>
  <body>
    {% include 'banner.html' %}

    <h1><span class="badge text-bg-secondary">Dashboard de Inventario - Stylopets</span></h1>

    <!-- Incluir el primer gráfico -->
    <div>
      <h2><span class="badge text-bg-secondary">Cantidad de Ingresos por Fecha</span></h2>
      {{ graph1_html|safe }}
    </div>

    <!-- Incluir el segundo gráfico -->
    <div>
      <h2><span class="badge text-bg-secondary">Stock Actual por Categoría</span></h2>
      {{ graph2_html|safe }}
    </div>

    {% include 'footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.9.0/plotly.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
